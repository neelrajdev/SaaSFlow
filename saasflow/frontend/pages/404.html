<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | SaaSFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 text-center bg-white" style="max-width: 520px; width: 100%;">
        <div class="d-inline-flex align-items-center justify-content-center p-3 mb-3 bg-primary-subtle text-primary rounded-circle mx-auto" style="width: 72px; height: 72px;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></svg>
    </div>

    <div class="badge bg-secondary-subtle text-secondary border px-3 py-1 rounded-pill mb-2 mx-auto">
      HTTP 404 Error
    </div>

        <h1 class="h3 fw-bold text-dark mb-2">Page Not Found</h1>
    <p class="text-secondary small mb-4">
      The screen you are trying to reach doesn't exist, has been moved, or the link is invalid.
    </p>

        <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
      <button type="button" id="btn-404-dashboard" class="btn btn-primary fw-semibold px-4 d-inline-flex align-items-center justify-content-center gap-2">
        <span>🏠</span> <span>Return to Dashboard</span>
      </button>
      <a href="../index.html" class="btn btn-outline-secondary px-4">
        Return to Login
      </a>
    </div>

    <div class="mt-4 pt-3 border-top text-muted small" style="font-size: 0.75rem;">
      SaaSFlow Simulated Multi-Consumer Platform
    </div>
  </div>

  <script type="module">
    import { getCurrentSession } from '../../backend-simulation/auth.js';
    
    document.addEventListener('DOMContentLoaded', () => {
      const session = getCurrentSession();
      const dashBtn = document.getElementById('btn-404-dashboard');
      if (dashBtn) {
        dashBtn.addEventListener('click', () => {
          if (!session || !session.role) {
            window.location.href = '../index.html';
            return;
          }
          if (session.role === 'founder') {
            window.location.href = 'overview.html';
          } else if (session.role === 'consumer') {
            window.location.href = 'my-api.html';
          } else if (session.role === 'finance') {
            window.location.href = 'billing.html';
          } else {
            window.location.href = '../index.html';
          }
        });
      }
    });
  </script>
</body>
</html>
